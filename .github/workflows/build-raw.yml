name: Build Raw

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-raw:
    name: Build raw image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install raw image tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: web
        run: bun run test

      - name: Test backend
        run: go test ./...

      - name: Build raw image
        run: bash scripts/build-raw.sh

      - name: Upload raw image
        uses: actions/upload-artifact@v6
        with:
          name: rt-raw
          path: rt.raw
          if-no-files-found: error

      - name: Upload raw image to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          asset="rt.raw"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "${tag}" \
              --notes "Raw image build for ${tag}"
          fi

          gh release upload "${tag}" "${asset}" --clobber
