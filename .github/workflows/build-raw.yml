name: Build Raw

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-raw:
    name: Build raw image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install raw image tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Test
        run: make test

      - name: Build raw image
        run: make raw
        env:
          BUILD_ID: ${{ github.run_number }}-${{ github.sha }}

      - name: Upload raw image
        uses: actions/upload-artifact@v4
        with:
          name: zimaos-login-demo-raw
          path: zimaos-login-demo.raw
          if-no-files-found: error
